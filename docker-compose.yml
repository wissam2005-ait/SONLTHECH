# ElectroPro — installation complète (base de données + serveur + site).
# 1. Copier .env.example en .env et le remplir.   2. docker compose up -d --build
# Le site est ensuite sur http://localhost (ou http://ADRESSE-DU-SERVEUR).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: electropro
      POSTGRES_USER: electropro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans le fichier .env}
      TZ: Africa/Algiers
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electropro -d electropro"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/electropro
      DB_USER: electropro
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET (32 caractères minimum) dans le fichier .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Définissez ADMIN_EMAIL dans le fichier .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD dans le fichier .env}
      CORS_ORIGIN: ${SITE_URL:-http://localhost}
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  db-data:
  uploads:
