# Développement uniquement : la base PostgreSQL seule (le serveur et l'interface tournent sur le poste).
# docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: electropro
      POSTGRES_USER: electropro
      POSTGRES_PASSWORD: electropro
    ports:
      - "5433:5432"
    volumes:
      - electropro-data:/var/lib/postgresql/data
volumes:
  electropro-data:
